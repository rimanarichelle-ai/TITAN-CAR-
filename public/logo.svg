<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <!-- Red Accent Gradient -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B3B" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Silver Light Facet -->
    <linearGradient id="silverLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Silver Dark Facet -->
    <linearGradient id="silverDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Silver Text Gradient -->
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Red Text Gradient -->
    <linearGradient id="redText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="60%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- EMBLEM GRAPHIC (Left side, viewBox 0..90) -->
  <g id="titan-emblem" transform="translate(5, 0) scale(0.85)">
    <image href="/logo-mark.png" x="0" y="0" width="120" height="110" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- LOGO TEXT (Right side) -->
  <g id="titan-brand-text" transform="translate(115, 0)">
    <!-- "TITAN" Text -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="46" letter-spacing="2" fill="url(#silverText)">
      TITAN
    </text>

    <!-- "CARS" Text -->
    <text x="168" y="58" font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="46" letter-spacing="1.5" fill="url(#redText)">
      CARS
    </text>

    <!-- Tagline Bar: Red Line Left, "DRIVE EXCELLENCE", Red Line Right -->
    <g transform="translate(0, 78)">
      <line x1="0" y1="-4" x2="45" y2="-4" stroke="url(#redGradient)" stroke-width="2.5" stroke-linecap="round" />
      <text x="54" y="0" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-weight="800" font-size="12" letter-spacing="4.5" fill="#E2E8F0">
        DRIVE EXCELLENCE
      </text>
      <line x1="282" y1="-4" x2="325" y2="-4" stroke="url(#redGradient)" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
